import org.gradle.api.file.ConfigurableFileCollection
import org.gradle.api.file.DirectoryProperty
import org.gradle.process.ExecOperations
import javax.inject.Inject

plugins {
    id 'com.android.application' version '8.11.1'
}

def sdlProperty = providers.gradleProperty('sdlSource').orNull
if (!sdlProperty) {
    throw new GradleException('Pass -PsdlSource=/absolute/path/to/SDL (release-3.4.0)')
}
def sdl = rootProject.file(sdlProperty)
def sdlJava = new File(sdl, 'android-project/app/src/main/java')
if (!new File(sdlJava, 'org/libsdl/app/SDLActivity.java').isFile()) {
    throw new GradleException("SDLActivity.java was not found under ${sdlJava}")
}

def port = rootProject.projectDir.parentFile
def sampleRoot = new File(port.parentFile, 'samples')
def importerScript = new File(port, 'tools/import_reference.py')
abstract class ImportCampaignAssets extends DefaultTask {
    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getReferenceFiles()

    @InputFile
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getImporter()

    @Internal
    abstract DirectoryProperty getSamples()

    @Input
    abstract Property<String> getPython()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @Inject
    abstract ExecOperations getExecOperations()

    @TaskAction
    void generate() {
        execOperations.exec {
            commandLine python.get(), importer.get().asFile, samples.get().asFile,
                        outputDirectory.dir('assets').get().asFile
        }
    }
}

def dependencyArguments = ['SDL3_IMAGE': 'sdlImageSource', 'SDL3_MIXER': 'sdlMixerSource'].collectMany { name, property ->
    def source = providers.gradleProperty(property).orNull
    source ? ["-DFETCHCONTENT_SOURCE_DIR_${name}=${rootProject.file(source).absolutePath}"] : []
}

android {
    namespace 'com.benno111.dorfplatformer9'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.benno111.dorfplatformer9'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
        }
        externalNativeBuild {
            cmake {
                arguments '-DDORF_FETCH_SDL=ON',
                          "-DFETCHCONTENT_SOURCE_DIR_SDL3=${sdl.absolutePath}",
                          '-DANDROID_STL=c++_static'
                arguments.addAll(dependencyArguments)
                targets 'dorfplatformer9'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path new File(port, 'CMakeLists.txt')
            version '3.31.6'
        }
    }

    sourceSets.main {
        java.srcDir sdlJava
    }
    buildTypes.release {
        // A release key can be supplied by the packaging environment.
        if (System.getenv('DORF_ANDROID_KEYSTORE')) {
            signingConfig signingConfigs.create('distribution') {
                storeFile file(System.getenv('DORF_ANDROID_KEYSTORE'))
                storePassword System.getenv('DORF_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('DORF_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('DORF_ANDROID_KEY_PASSWORD')
            }
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def importAssets = tasks.register("import${variant.name.capitalize()}CampaignAssets", ImportCampaignAssets) {
            importer.set(importerScript)
            samples.set(sampleRoot)
            python.set(providers.gradleProperty('python').getOrElse('python3'))
            referenceFiles.from(fileTree(new File(port, 'art/hud')) { include '*.svg' })
            referenceFiles.from(fileTree(sampleRoot) {
                include 'source/project.json', 'documentation/port_reference/levels.json'
                include 'assets/images/**', 'assets/audio/**'
            })
        }
        variant.sources.assets.addGeneratedSourceDirectory(importAssets) { task -> task.outputDirectory }
    }
}
